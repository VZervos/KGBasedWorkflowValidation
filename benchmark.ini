[benchmark]
input = dataset/DomesticDeclarations.xes.gz
output_dir = benchmarks
seed = 42

# For each rule use either count=N or percent=P (not both).
# percent is applied to the total XES line count, then capped by eligible items.
# If fewer eligible items exist than requested, all eligible items are corrupted.

[r1]
enabled = true
percent = 5
;count = 3


[r2]
enabled = true
percent = 5
;count = 2

[r3]
enabled = true
percent = 5
;count = 2